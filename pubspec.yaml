name: syria_market_2028
description: "Souq Syria Market Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- 1. Supabase Core & Auth & Storage ---
  supabase_flutter: ^2.8.4

  # --- 2. Firebase & Cloud Messaging & Analytics ---
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  firebase_analytics: ^11.4.0

  # --- 3. State Management & Navigation ---
  flutter_riverpod: ^2.6.1 # أو provider: ^6.1.2 بحسب النمط المفضل لديك
  provider: ^6.1.2

  # --- 4. Utilities & Caching ---
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2

  # --- 5. UI Helpers & Icons ---
  flutter_spinkit: ^5.2.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_colorpicker: ^1.1.0
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
